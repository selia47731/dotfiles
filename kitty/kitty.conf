# ==== Font ====
font_family HackGen
font_size 20.0
bold_font auto
italic_font auto
bold_italic_font auto

# ==== Window ====
initial_window_width 151c
initial_window_height 60c
background_opacity 0.85
background_blur 0
hide_window_decorations yes
confirm_os_window_close 0

# ==== Cursor ====
cursor_stop_blinking_after 0

# ==== Tabs ====
tab_bar_min_tabs 2
tab_bar_style hidden

# ==== Colors: Aardvark Blue ====
foreground #dddddd
background #102040
cursor #007acc
selection_foreground #000000
selection_background #bfdbfe

color0  #191919
color1  #aa342e
color2  #4b8c0f
color3  #dbba00
color4  #1370d3
color5  #c43ac3
color6  #008eb0
color7  #bebebe

color8  #555555
color9  #ff665c
color10 #8cc85f
color11 #efc541
color12 #3393ff
color13 #d28cff
color14 #46c4d8
color15 #ffffff

# ==== macOS ====
macos_option_as_alt no
macos_quit_when_last_window_closed yes

# ==== Keybindings ====
map cmd+t new_tab
map cmd+w close_tab
map cmd+q quit
map cmd+n new_os_window
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map alt+enter toggle_fullscreen
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# ==== Misc ====
enable_audio_bell no
